# Typecheck, test and build every pull request against main (spec §7.1).
name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Link sandworm
        # package.json links sandworm from a local checkout (`link:sandworm`); CI clones and links it the same way.
        run: git clone --depth 1 https://github.com/danmcfan/sandworm ../sandworm && cd ../sandworm && bun install --frozen-lockfile && bun link
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Unused code
        run: bun run knip
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
